<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Tic-Tac-Toe</title>
<style>
  :root{
    --bg: #0f1220;
    --panel: #171b2e;
    --line: #2c3358;
    --line-soft: #232849;
    --x-color: #5eead4;
    --o-color: #f472b6;
    --accent: #7c8aff;
    --active: #2a2f52;
    --won-x: rgba(94,234,212,0.15);
    --won-o: rgba(244,114,182,0.15);
    --text: #e6e9f5;
    --muted: #8b91b3;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 20% 10%, #1a1f3d 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .app{
    display:flex; flex-direction:column; align-items:center;
    gap:16px; padding:20px; width:100%; max-width:640px;
  }
  h1{
    margin:0; font-size:1.6rem; letter-spacing:0.5px;
    background: linear-gradient(90deg, var(--x-color), var(--o-color));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-align:center;
  }
  .status{
    font-size:1.05rem; min-height:1.4em; text-align:center; color: var(--text);
  }
  .status .mark{ font-weight:700; }
  .status .mark.x{ color: var(--x-color); }
  .status .mark.o{ color: var(--o-color); }

  .board-wrap{
    background: var(--panel);
    border-radius: 18px;
    padding: clamp(8px, 2.5vw, 16px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    border: 1px solid var(--line-soft);
  }
  .super-board{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(4px, 1.6vw, 10px);
    width: min(88vw, 560px);
    aspect-ratio: 1 / 1;
  }
  .mini-board{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    background: var(--line);
    border-radius: 10px;
    padding: 4px;
    position: relative;
    transition: background-color .25s ease, box-shadow .25s ease;
  }
  .mini-board.active{
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--accent), 0 0 18px rgba(124,138,255,0.55);
  }
  .mini-board.won-X{ background: var(--won-x); }
  .mini-board.won-O{ background: var(--won-o); }
  .mini-board.won-X, .mini-board.won-O{ box-shadow:none; }

  .cell{
    background: var(--panel);
    border: none;
    border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(1rem, 3.4vw, 1.5rem);
    font-weight: 700;
    cursor:pointer;
    color: var(--text);
    aspect-ratio: 1/1;
    transition: background-color .15s ease, transform .1s ease;
    user-select:none;
  }
  .cell:hover:not(:disabled){ background:#20264a; transform: scale(1.04); }
  .cell:disabled{ cursor:default; }
  .cell.x{ color: var(--x-color); }
  .cell.o{ color: var(--o-color); }

  .mini-board.won-X::after, .mini-board.won-O::after{
    content: attr(data-mark);
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(2.4rem, 9vw, 4rem);
    font-weight: 800;
    opacity:0.9;
    pointer-events:none;
  }
  .mini-board.won-X::after{ color: var(--x-color); }
  .mini-board.won-O::after{ color: var(--o-color); }
  .mini-board.won-X .cell, .mini-board.won-O .cell{ visibility:hidden; }

  .mini-board.draw{ background: var(--line-soft); }
  .mini-board.draw::after{
    content:"–";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(2rem, 7vw, 3rem);
    color: var(--muted);
    pointer-events:none;
  }
  .mini-board.draw .cell{ visibility:hidden; }

  .controls{
    display:flex; gap:10px; margin-top:4px;
  }
  button.reset{
    background: linear-gradient(135deg, var(--x-color), var(--o-color));
    border:none; color:#0f1220; font-weight:700;
    padding:10px 20px; border-radius:10px; cursor:pointer;
    font-size:0.95rem; letter-spacing:0.3px;
    transition: transform .1s ease, box-shadow .15s ease;
  }
  button.reset:hover{ transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,138,255,0.35); }
  button.reset:active{ transform: translateY(0); }

  .legend{
    font-size:0.8rem; color: var(--muted); text-align:center; max-width:480px; line-height:1.4;
  }

  .winner-banner{
    font-size:1.3rem; font-weight:800; text-align:center;
    padding:6px 0;
  }
  .winner-banner.X{ color: var(--x-color); }
  .winner-banner.O{ color: var(--o-color); }
  .winner-banner.draw{ color: var(--muted); }
</style>
</head>
<body>
  <div class="app">
    <h1>Super Tic-Tac-Toe</h1>
    <div class="status" id="status"></div>
    <div class="board-wrap">
      <div class="super-board" id="superBoard"></div>
    </div>
    <div class="controls">
      <button class="reset" id="resetBtn">New Game</button>
    </div>
    <div class="legend">
      Win a small board to claim it. Your move picks which board your opponent plays next — send them to a corner cell and they play top-right next. Win three claimed boards in a row to take the whole game.
    </div>
  </div>

<script>
(function(){
  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  // state
  let boards = Array.from({length:9}, () => Array(9).fill(null)); // 9 mini boards, 9 cells each
  let boardWinners = Array(9).fill(null); // 'X' | 'O' | 'draw' | null
  let currentPlayer = 'X';
  let activeBoard = null; // null = any board allowed
  let gameOver = false;
  let overallWinner = null;

  const superBoardEl = document.getElementById('superBoard');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');

  function checkWinner(cells){
    for(const [a,b,c] of WIN_LINES){
      if(cells[a] && cells[a] === cells[b] && cells[b] === cells[c]){
        return cells[a];
      }
    }
    if(cells.every(c => c !== null)) return 'draw';
    return null;
  }

  function render(){
    superBoardEl.innerHTML = '';
    for(let b=0;b<9;b++){
      const miniEl = document.createElement('div');
      miniEl.className = 'mini-board';
      const winner = boardWinners[b];
      if(winner === 'X') { miniEl.classList.add('won-X'); miniEl.setAttribute('data-mark','X'); }
      else if(winner === 'O') { miniEl.classList.add('won-O'); miniEl.setAttribute('data-mark','O'); }
      else if(winner === 'draw') { miniEl.classList.add('draw'); }

      const isActive = !gameOver && !winner && (activeBoard === null || activeBoard === b);
      if(isActive) miniEl.classList.add('active');

      for(let c=0;c<9;c++){
        const cellBtn = document.createElement('button');
        cellBtn.className = 'cell';
        const val = boards[b][c];
        if(val === 'X') cellBtn.classList.add('x');
        if(val === 'O') cellBtn.classList.add('o');
        cellBtn.textContent = val || '';
        const playable = !gameOver && !winner && val === null && (activeBoard === null || activeBoard === b);
        cellBtn.disabled = !playable;
        cellBtn.addEventListener('click', () => makeMove(b,c));
        miniEl.appendChild(cellBtn);
      }
      superBoardEl.appendChild(miniEl);
    }
    updateStatus();
  }

  function updateStatus(){
    if(gameOver){
      if(overallWinner === 'draw'){
        statusEl.innerHTML = `<span class="winner-banner draw">It's a draw!</span>`;
      } else {
        statusEl.innerHTML = `<span class="winner-banner ${overallWinner}">Player ${overallWinner} wins the game!</span>`;
      }
      return;
    }
    const markSpan = `<span class="mark ${currentPlayer.toLowerCase()}">${currentPlayer}</span>`;
    if(activeBoard === null){
      statusEl.innerHTML = `${markSpan}'s turn — play any board`;
    } else {
      statusEl.innerHTML = `${markSpan}'s turn — must play in board ${activeBoard + 1}`;
    }
  }

  function makeMove(boardIdx, cellIdx){
    if(gameOver) return;
    if(boardWinners[boardIdx]) return;
    if(activeBoard !== null && activeBoard !== boardIdx) return;
    if(boards[boardIdx][cellIdx] !== null) return;

    boards[boardIdx][cellIdx] = currentPlayer;

    const result = checkWinner(boards[boardIdx]);
    if(result) boardWinners[boardIdx] = result;

    const overallResult = checkWinner(boardWinners.map(w => w === 'draw' ? null : w));
    if(overallResult){
      gameOver = true;
      overallWinner = overallResult;
    } else if(boardWinners.every(w => w !== null)){
      gameOver = true;
      overallWinner = 'draw';
    } else {
      // determine next active board
      const nextBoard = cellIdx;
      activeBoard = boardWinners[nextBoard] ? null : nextBoard;
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    }

    render();
  }

  function resetGame(){
    boards = Array.from({length:9}, () => Array(9).fill(null));
    boardWinners = Array(9).fill(null);
    currentPlayer = 'X';
    activeBoard = null;
    gameOver = false;
    overallWinner = null;
    render();
  }

  resetBtn.addEventListener('click', resetGame);
  render();
})();
</script>
</body>
</html>
